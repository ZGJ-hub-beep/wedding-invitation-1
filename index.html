<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赵耿佳 & 李丹 结婚邀请函生成器</title>
    <style>
        /* 引入马善政毛笔字体 */
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #2c2c2c;
            display: flex;
            min-height: 100vh;
            font-family: 'Noto Serif SC', serif;
            color: #fff;
        }

        /* 左侧操作面板 */
        .control-panel {
            width: 320px;
            background-color: #1a1a1a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            z-index: 100;
        }

        .control-panel h2 {
            font-size: 18px;
            color: #ffd700;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
            margin-bottom: 5px;
            text-align: center;
        }

        .control-group {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .control-group h3 {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 10px;
        }

        .input-row label {
            font-size: 12px;
            color: #ccc;
        }

        .input-row input, .input-row textarea {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            outline: none;
        }

        .input-row input:focus, .input-row textarea:focus {
            border-color: #ffd700;
        }

        .btn {
            padding: 10px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 5px;
        }

        .btn-primary {
            background-color: #ffd700;
            color: #1a1a1a;
        }

        .btn-primary:hover {
            background-color: #ffed4a;
            transform: scale(1.02);
        }

        .btn-download {
            background-color: #4caf50;
            color: white;
        }

        .btn-download:hover {
            background-color: #45a049;
            transform: scale(1.02);
        }

        .btn-batch {
            background-color: #2196f3;
            color: white;
        }

        .btn-batch:hover {
            background-color: #0b7ad1;
            transform: scale(1.02);
        }

        .file-upload {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .file-upload-label {
            display: block;
            padding: 10px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 5px;
            border: 1px dashed #666;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .file-upload-label:hover {
            background-color: #444;
            border-color: #ffd700;
        }

        .batch-status {
            font-size: 12px;
            color: #aaa;
            margin-top: 5px;
            text-align: center;
        }

        /* 右侧邀请函预览区域 */
        .preview-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #3a3a3a;
            padding: 20px;
            overflow: auto;
        }

            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;

<body>

    <div class="control-panel">
        <h2>邀请函生成工具</h2>

        <div class="control-group">
            <h3>✏️ 单张编辑</h3>
            <div class="input-row">
                <label>被邀请人姓名</label>
                <input type="text" id="inputInvitee" value="XXX" placeholder="请输入姓名">
            </div>
            <div class="input-row">
                <label>婚礼时间</label>
                <input type="text" id="inputTime" value="公历：2026年10月1日 星期四 | 农历：八月廿一" placeholder="格式：公历... | 农历...">
            </div>
            <div class="input-row">
                <label>喜宴地址</label>
                <input type="text" id="inputAddress" value="朱柳本宅" placeholder="请输入地址">
            </div>
            <button class="btn btn-primary" onclick="updatePreview()">更新预览</button>
            <button class="btn btn-download" onclick="downloadSingleImage()">📥 下载当前图片</button>
        </div>

        <div class="control-group">
            <h3>📊 Excel 批量生成</h3>
            <p style="font-size:12px; color:#aaa; margin-bottom:10px;">
                请上传 Excel 文件，第一列第一行为标题（如“姓名”），下方为被邀请人姓名。
            </p>
            <div class="file-upload">
                <label class="file-upload-label" for="excelFile">点击选择 Excel 文件 (.xlsx / .xls)</label>
                <input type="file" id="excelFile" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
            </div>
            <div class="batch-status" id="batchStatus">未导入文件</div>
            <button class="btn btn-batch" onclick="batchDownload()" id="btnBatchDownload" disabled>🚀 批量下载图片</button>
        </div>
    </div>

    <div class="preview-area">
        <div class="invitation-container" id="invitationCard">
            <div class="text-content">
                <div class="invite-word">
                    <span>诚邀</span>
                    <span id="inviteeName" class="invitee-name">XXX</span>
                    <span>参加</span>
                </div>

                <div class="names-row">
                    <span>新郎：赵耿佳</span>
                    <span>新娘：李丹</span>
                </div>

                <div class="ceremony-text">结婚典礼 · 敬备喜宴</div>

                <div class="time-title">婚礼时间</div>

                <div class="time-details" id="timeDetails">
                    <div>公历：2026年10月1日 星期四</div>
                    <div>农历：八月廿一</div>
                </div>

                <div class="address" id="addressText">地址：朱柳本宅</div>

                <div class="respectfully-invite">敬邀</div>
            </div>
        </div>
    </div>

    <script>
        let inviteeList = [];
        let isBatchDownloading = false;

        function updatePreview() {
            let name = document.getElementById('inputInvitee').value.trim() || 'XXX';
            let timeStr = document.getElementById('inputTime').value.trim();
            let address = document.getElementById('inputAddress').value.trim();

            document.getElementById('inviteeName').innerText = name;

            let timeParts = timeStr.split('|').map(s => s.trim());
            let timeHtml = '';
            if (timeParts.length >= 2) {
                timeHtml = `<div>${timeParts[0]}</div><div>${timeParts[1]}</div>`;
            } else {
                timeHtml = `<div>${timeParts[0]}</div>`;
            }
            document.getElementById('timeDetails').innerHTML = timeHtml;
            document.getElementById('addressText').innerText = "地址：" + address;
        }

        function downloadSingleImage() {
            const element = document.getElementById('invitationCard');
            const name = document.getElementById('inviteeName').innerText;
            
            html2canvas(element, {
                scale: 2,
                useCORS: true,
                backgroundColor: null,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `邀请函_${name}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("生成图片失败: ", err);
                alert("生成图片失败！请确保您已将背景图转换为 Base64 代码替换到 CSS 中，或检查浏览器控制台的错误信息。");
            });
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});
                
                inviteeList = [];
                for (let i = 1; i < jsonData.length; i++) {
                    if (jsonData[i][0] !== undefined && jsonData[i][0] !== null) {
                        inviteeList.push(String(jsonData[i][0]).trim());
                    }
                }

                if (inviteeList.length > 0) {
                    document.getElementById('batchStatus').innerText = `已导入 ${inviteeList.length} 位宾客`;
                    document.getElementById('btnBatchDownload').disabled = false;
                } else {
                    document.getElementById('batchStatus').innerText = `未在 Excel 中找到有效姓名`;
                    document.getElementById('btnBatchDownload').disabled = true;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        async function batchDownload() {
            if (inviteeList.length === 0) {
                alert("请先导入包含姓名的 Excel 文件！");
                return;
            }
            if (isBatchDownloading) return;

            isBatchDownloading = true;
            const btn = document.getElementById('btnBatchDownload');
            const originalText = btn.innerText;
            btn.innerText = "正在生成...";
            btn.disabled = true;

            const element = document.getElementById('invitationCard');
            const timeStr = document.getElementById('inputTime').value.trim();
            const address = document.getElementById('inputAddress').value.trim();

            let timeParts = timeStr.split('|').map(s => s.trim());
            let timeHtml = '';
            if (timeParts.length >= 2) {
                timeHtml = `<div>${timeParts[0]}</div><div>${timeParts[1]}</div>`;
            } else {
                timeHtml = `<div>${timeParts[0]}</div>`;
            }
            document.getElementById('timeDetails').innerHTML = timeHtml;
            document.getElementById('addressText').innerText = "地址：" + address;

            for (let i = 0; i < inviteeList.length; i++) {
                const name = inviteeList[i];
                document.getElementById('inviteeName').innerText = name;
                
                await new Promise(resolve => setTimeout(resolve, 150));

                try {
                    const canvas = await html2canvas(element, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: null,
                        logging: false
                    });
                    
                    const link = document.createElement('a');
                    link.download = `邀请函_${name}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    await new Promise(resolve => setTimeout(resolve, 400));
                } catch (err) {
                    console.error(`生成 ${name} 的图片失败: `, err);
                }
            }

            isBatchDownloading = false;
            btn.innerText = originalText;
            btn.disabled = false;
            document.getElementById('batchStatus').innerText = `批量下载完成！共生成 ${inviteeList.length} 张图片。`;
            
            if (inviteeList.length > 0) {
                document.getElementById('inviteeName').innerText = inviteeList[0];
                document.getElementById('inputInvitee').value = inviteeList[0];
            }
        }

        window.onload = function() {
            updatePreview();
        };
    </script>
</body>
</html>
